name: build-apk
on:
  workflow_dispatch:
  push:
jobs:
  assemble:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nfc-cards
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      # wrapper jar is not in the archive, so call gradle directly
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: nfc-cards-debug-apk
          path: nfc-cards/app/build/outputs/apk/debug/app-debug.apk
